<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yk</title>
<meta name="description" content="개인용 웹앱 모음">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23f7f4ef'/%3E%3Ctext x='16' y='22' font-size='17' font-family='Georgia,serif' fill='%234b5d78' text-anchor='middle'%3Eyk%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 조용한 개인 페이지.
     제목은 고운바탕(명조), 본문은 시스템 고딕.
     앱마다 다른 색은 --u 로 넘기되, 띠가 아니라 점과 화살표에만 쓴다. */

  :root {
    --bg:        #f7f4ef;        /* 따뜻한 아이보리 */
    --bg-2:      #f2ede5;
    --surface:   #fffdfa;
    --ink:       #322e29;        /* 검정 대신 따뜻한 먹색 */
    --ink-soft:  #7b7267;
    --ink-faint: #a79d90;
    --line:      #e6ded2;
    --line-soft: #efe9e0;
    --u:         #4b5d78;        /* 앱 색 기본값 */
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #1a1714;
      --bg-2:      #16130f;
      --surface:   #232019;
      --ink:       #ece5d9;
      --ink-soft:  #a59a8a;
      --ink-faint: #7a7063;
      --line:      #332e26;
      --line-soft: #2a251f;
      --u:         #8fa6c4;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body {
    background: linear-gradient(175deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "맑은 고딕", "Malgun Gothic", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.75;
    word-break: keep-all;          /* 한글이 낱말 가운데서 끊기지 않게 */
    overflow-wrap: anywhere;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* 대시보드가 아니라 한 사람의 페이지로 보이게 단을 좁게 잡는다 */
  .wrap { max-width: 560px; margin: 0 auto; padding: 72px 24px 72px; }

  /* ── 머리말 ─────────────────────────────────────────── */
  .head { margin-bottom: 44px; }
  .mark {
    margin: 0;
    font-family: "Gowun Batang", "바탕", serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.2;
    letter-spacing: .01em;
  }
  .rule {
    width: 34px;
    height: 1px;
    margin: 18px 0 16px;
    background: var(--ink-faint);
  }
  .today {
    margin: 0;
    color: var(--ink-faint);
    font-size: 13px;
    letter-spacing: .06em;
  }

  /* ── 앱 목록 ────────────────────────────────────────── */
  .list { display: flex; flex-direction: column; gap: 14px; }

  .item {
    position: relative;
    display: block;
    padding: 24px 26px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    text-decoration: none;
    color: inherit;
    transition: border-color .25s ease, background .25s ease;
  }
  .item:hover, .item:focus-visible { border-color: var(--u); outline: none; }
  .item:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--u) 22%, transparent); }

  /* 제목 앞의 작은 점 하나가 앱 색을 대신한다 */
  .dot {
    display: inline-block;
    width: 7px; height: 7px;
    margin-right: 10px;
    border-radius: 50%;
    background: var(--u);
    vertical-align: middle;
    transform: translateY(-2px);
  }
  .name {
    margin: 0;
    font-family: "Gowun Batang", "바탕", serif;
    font-weight: 700;
    font-size: 21px;
    line-height: 1.4;
  }
  .desc { margin: 6px 0 0; color: var(--ink-soft); font-size: 14.5px; line-height: 1.7; }

  .foot {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line-soft);
  }
  .meta { color: var(--ink-faint); font-size: 12.5px; letter-spacing: .04em; }
  .arrow {
    margin-left: auto;
    color: var(--u);
    font-size: 13px;
    letter-spacing: .04em;
    white-space: nowrap;
    transition: transform .25s ease;
  }
  .item:hover .arrow, .item:focus-visible .arrow { transform: translateX(4px); }

  /* ── 꼬리말 ─────────────────────────────────────────── */
  .foot-note {
    margin-top: 48px;
    padding-top: 22px;
    border-top: 1px solid var(--line-soft);
    color: var(--ink-faint);
    font-size: 12.5px;
    line-height: 1.85;
  }
  .foot-note p { margin: 0; }

  @media (max-width: 420px) {
    .wrap { padding: 52px 20px 56px; }
    .item { padding: 21px 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .item, .arrow { transition: none; }
    .item:hover .arrow, .item:focus-visible .arrow { transform: none; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="head">
    <h1 class="mark">yk</h1>
    <div class="rule"></div>
    <p class="today" id="today"></p>
  </header>

  <div class="list">

    <a class="item" style="--u:#4b5d78" href="https://nuntda-study.vercel.app">
      <p class="name"><span class="dot" aria-hidden="true"></span>눈트다</p>
      <p class="desc">강의를 듣고, 교재로 익히고, 복습하고, 오늘 한 만큼을 남깁니다.</p>
      <span class="foot">
        <span class="meta">영어 학습</span>
        <span class="arrow">들어가기 →</span>
      </span>
    </a>

    <a class="item" style="--u:#a4695f" href="diary/">
      <p class="name"><span class="dot" aria-hidden="true"></span>오늘의 한 쪽</p>
      <p class="desc">달력을 넘기며 그날의 한 쪽을 씁니다. 사진도 함께 넣어 둡니다.</p>
      <span class="foot">
        <span class="meta">일기</span>
        <span class="arrow">들어가기 →</span>
      </span>
    </a>

  </div>

  <footer class="foot-note">
    <p>혼자 쓰는 페이지입니다. 각 앱은 로그인해야 열립니다.</p>
    <p>일기의 글과 사진은 이곳에 올라오지 않고, 본인만 열 수 있게 잠겨 있습니다.</p>
  </footer>

</div>

<script>
  // 날짜 한 줄. 자바스크립트가 막혀 있으면 그냥 빈 줄로 남는다.
  (function () {
    var d = new Date();
    var days = ["일", "월", "화", "수", "목", "금", "토"];
    document.getElementById("today").textContent =
      d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + days[d.getDay()] + "요일";
  })();
</script>

</body>
</html>
